name: sentinella
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "watch.py"
      - ".github/workflows/sentinella.yml"
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: controlla e scarica
        id: check
        continue-on-error: true
        run: python watch.py
      - name: salva
        if: always()
        run: |
          git config user.name bot
          git config user.email bot@local
          git add -A
          git commit -m "aggiornamento $(date -u +%FT%TZ)" || echo "nessuna modifica"
          git push || echo "push rifiutato"